# Holder Supabase-prosjektet GRUVE aktivt, så gratisplanen ikke pauser det etter 7 dager uten bruk.
name: Hold Supabase våken
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping GRUVE-databasen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://tcuefkqomitykaknoyyn.supabase.co/rest/v1/addresses?select=id&limit=1" -H "apikey: sb_publishable_WQU2jS0hAiEZR3hwoIL7mQ_E-FPMdkn")
          echo "Supabase svarte $code"
          test "$code" = "200"
